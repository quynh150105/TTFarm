spring.application.name=TTFarm

server.port=${SERVER_PORT}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION_TIME}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION_TIME}


springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.packagesToScan=quynh.family.TTFarm.controller
springdoc.pathsToMatch=/**

#Security Endpoint
security.public-endpoints=/api/v1/auth/login
security.user-endpoints=/api/v1/user/**
security.admin-endpoints=/api/v1/admin/**
security.swagger-endpoints=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS}

#Info Admin
app.admin.username=${APP_ADMIN_USERNAME}
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}
app.admin.firstName=${APP_ADMIN_FIRSTNAME}
app.admin.lastName=${APP_ADMIN_LASTNAME}
